provider: CoreDNS
providerId: coredns
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Apache 2.0
  - Cloud Native
  - CNCF
  - DNS
  - Go
  - Graduated
  - Kubernetes
  - Networking
  - Open Source
  - Plugins
