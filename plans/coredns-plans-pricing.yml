description: CoreDNS is an open-source CNCF Graduated DNS server, released under the Apache 2.0 license.
  There is no commercial offering or paid plan from the upstream CoreDNS project. The software is free
  to download, run, and extend. Commercial support is sometimes available indirectly through Kubernetes
  distribution vendors that bundle CoreDNS, but no CoreDNS-branded paid plan exists.
sources:
  - https://coredns.io/
  - https://github.com/coredns/coredns
  - https://www.cncf.io/projects/coredns/
plans:
  - id: coredns-open-source
    name: Open Source
    type: freemium
    description: Apache 2.0 licensed open-source CoreDNS release. Free to use, modify, and distribute.
      No commercial pricing applies.
    entries:
      - label: Software license
        name: license
        type: flat
        metric: license
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Apache 2.0 license
      - name: CNCF Graduated project
      - name: Community support via GitHub and CNCF Slack
      - name: CoreDNS DNS Interface
      - name: CoreDNS Plugin API
      - name: CoreDNS Health API
      - name: CoreDNS Metrics API
notes: CoreDNS is an open-source CNCF Graduated project with no upstream commercial pricing. The DNS
  server itself runs in-cluster (or as standalone process) and is not metered. Reconciled is false
  because there is no provider-published pricing to reconcile against.
maintainers:
