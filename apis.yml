aid: coredns
name: CoreDNS
kind: opensource
description: >-
  CoreDNS is a CNCF graduated DNS server written in Go that serves as the default DNS service for Kubernetes clusters.
  It is flexible and extensible through a plugin architecture, supporting DNS-based service discovery, forwarding,
  caching, and integration with etcd, Kubernetes, and other backends. CoreDNS can serve as an authoritative DNS server
  or a recursive resolver, with HTTP plugins exposing health, readiness, and Prometheus metrics endpoints for Kubernetes
  operations.
