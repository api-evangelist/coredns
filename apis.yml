apis:
- aid: coredns:coredns-dns-api
  name: CoreDNS DNS Interface
  description: >-
    CoreDNS implements the standard DNS protocol (RFC 1035) serving both UDP and TCP queries. In Kubernetes,
    it resolves service names to cluster IPs, headless services to pod IPs, and supports SRV records for
    port discovery. The Kubernetes plugin watches the API server for service and endpoint changes to keep
    DNS records current. Additional protocol bindings include DNS-over-TLS (DoT), DNS-over-HTTPS (DoH),
    DNS-over-QUIC (DoQ), and gRPC.
  humanURL: https://coredns.io/manual/toc/
  properties:
  - type: Documentation
    url: https://coredns.io/manual/toc/
  tags:
  - DNS
  - DoH
  - DoQ
  - DoT
  - Kubernetes
  - Service Discovery
- aid: coredns:coredns-plugin-api
  name: CoreDNS Plugin API
  description: >-
    The CoreDNS plugin framework allows extending DNS server functionality through a chain of plugins
    defined in the Corefile configuration. External plugins can be written in Go to add custom DNS record
    sources, filtering, metrics, and middleware. Each plugin implements the Handler interface to process
    DNS requests.
  humanURL: https://coredns.io/explugins/
  properties:
  - type: Documentation
    url: https://coredns.io/explugins/
  - type: Reference
    url: https://coredns.io/manual/plugins/
  tags:
  - Extensibility
  - Plugins
