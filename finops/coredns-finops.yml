description: FinOps shape for CoreDNS - an Apache 2.0 / CNCF Graduated open-source DNS server. There
  is no upstream invoice. Operator cost is borne by the underlying Kubernetes / cloud platform compute
  consumed by CoreDNS pods and any DNS-egress charges from upstream resolvers.
