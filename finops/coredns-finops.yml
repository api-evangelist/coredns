meters:
  - name: coredns_pods
    description: CoreDNS pods running in the cluster (compute time consumed, billed by the underlying
      Kubernetes platform)
    unit: pod-hour
    aggregation: sum
    dimensions:
      - cluster
      - namespace
  - name: dns_queries
    description: DNS queries processed (operational metric exported via the Prometheus plugin; not
      directly billed by CoreDNS)
    unit: query
    aggregation: sum
    dimensions:
      - cluster
      - zone
      - rcode
  - name: upstream_egress
    description: Bytes egressed to upstream resolvers via the forward plugin (drives cloud-egress charges)
    unit: GB
    aggregation: sum
    dimensions:
      - cluster
      - upstream
principles:
  - name: Visibility
    description: CoreDNS itself is free; observe cost via the Prometheus /metrics endpoint (request
      counters, latency histograms) joined to FOCUS-aligned cluster billing.
  - name: Allocation
    description: Allocate the cost of CoreDNS pods to platform / cluster-services budgets; the per-tenant
      "DNS cost" is typically rolled into a shared platform charge rather than per-namespace.
  - name: Optimization
    description: Tune the cache plugin TTL to reduce upstream lookups; adjust replica count and resource
      requests to actual QPS; use autopath / minimal to shorten search-domain lookups in Kubernetes;
      throttle abusive sources with the ratelimit plugin to avoid CPU spikes.
  - name: Accountability
    description: Assign a platform-team owner for CoreDNS; alert on SERVFAIL rate, cache-miss ratio,
      and pod CPU saturation; review upgrade cadence aligned with CNCF release schedule.
notes: CoreDNS is open-source with no upstream commercial billing. FinOps for CoreDNS is really FinOps
  for the Kubernetes / cloud platform that hosts it. Reconciled is false because there is no provider
  rate card or invoice to reconcile against.
